name: clinic-management

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinic_management
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic_local_password
    ports:
      - "5434:5432"
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic_management"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=database;Port=5432;Database=clinic_management;Username=clinic;Password=clinic_local_password
      Jwt__Key: clinic-development-signing-key-change-before-production-2026
      Jwt__Issuer: ClinicManagement.Api
      Jwt__Audience: ClinicManagement.Frontend
      AllowedOrigins__0: http://localhost:5173
      RESET_TRIAL_DATA: ${RESET_TRIAL_DATA:-false}
    ports:
      - "5080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  clinic_postgres_data:
