services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: juvic_clinic
      POSTGRES_USER: juvic
      POSTGRES_PASSWORD: juvic_local_password
    ports:
      - "5434:5432"
    volumes:
      - juvic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U juvic -d juvic_clinic"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=database;Port=5432;Database=juvic_clinic;Username=juvic;Password=juvic_local_password
      Jwt__Key: juvic-development-signing-key-change-before-production-2026
      Jwt__Issuer: JuvicClinic.Api
      Jwt__Audience: JuvicClinic.Frontend
      AllowedOrigins__0: http://localhost:5173
    ports:
      - "5080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  juvic_postgres_data:
